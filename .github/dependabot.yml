version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Qyzylorda
    open-pull-requests-limit: 5
    groups:
      frontend-security-updates:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
